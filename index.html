return`<div class="bar np"><h2 style="margin:0;flex:1">تحرير المذكرة</h2><button class="btn s o" onclick="sel.mid=null;go()">← القائمة</button></div><div class="card np"><div class="g">${f.map(([k,l])=>`<div><label class="m">${l}</label><input value="${E(m[k])}" oninput="mu('${k}',this.value)"></div>`).join('')}</div><label class="m">الأهداف التعلمية (سطر لكل هدف)</label><textarea rows="3" oninput="cur().comp=this.value.split('\\n').filter(x=>x.trim());mu()">${E(m.comp.join('\n'))}</textarea><label class="m">السندات</label><textarea rows="2" oninput="cur().means=this.value.split('\\n').filter(x=>x.trim());mu()">${E(m.means.join('\n'))}</textarea></div>${m.rows.map((r,i)=>`<div class="card np"><div class="bar"><input style="width:150px" value="${E(r.stage)}" oninput="mr(${i},'stage',this.value)"><input style="width:80px" placeholder="الزمن" value="${E(r.time)}" oninput="mr(${i},'time',this.value)"><button class="btn s d" onclick="cur().rows.splice(${i},1);save();go()">حذف</button></div><label class="m">الوضعيات التعلمية</label><textarea rows="8" oninput="mr(${i},'text',this.value)">${E(r.text)}</textarea><label class="m">التقويم</label><textarea rows="2" oninput="mr(${i},'eval',this.value)">${E(r.eval)}</textarea></div>`).join('')}<div class="bar np"><button class="btn o" onclick="cur().rows.push({stage:'',text:'',eval:'',time:''});save();go()">+ مرحلة</button><button class="btn" onclick="memSave('docx')">تحميل Word</button><button class="btn" onclick="memPdf()">طباعة / PDF</button><button class="btn o" onclick="memSave('html')">نسخة للطباعة (HTML)</button></div><h3 class="np">المعاينة</h3><div id="pv">${docHtml(m)}</div>`};
const pv=()=>{const e=$('#pv');if(e)e.innerHTML=docHtml(cur())};
function mu(k,v){if(k)cur()[k]=v;save();pv()}function mr(i,k,v){cur().rows[i][k]=v;save();pv()}
function memPdf(){document.body.classList.add('pp');window.print();setTimeout(()=>document.body.classList.remove('pp'),800)}
async function aiJson(sm,prompt){if(sm)return sm.json(prompt);const q=await sb.functions.invoke('generate-plan',{body:{prompt}});if(q.error){let m='',st='';try{st=q.error.context.status}catch(e){}try{m=(await q.error.context.json()).error}catch(e){}throw new Error(m=='limit'?'limit':(m||q.error.name||'ai')+' '+st)}const t=String(q.data.text||'').replace(/```json|```/g,'');return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}
async function memGen(blank){const c=cl($('#mc').value),m={id:id(),cid:c.id,level:c.level,cname:c.name,subject:c.subject,teacher:db.teacher,topic:$('#mt').value,field:$('#mf').value,seg:$('#ms').value,week:$('#mw').value,dur:$('#md').value,date:today(),comp:[],means:['السبورة','الكتاب المدرسي'],rows:STG.map(s=>({stage:s,text:'',eval:'',time:''}))};
if(!m.topic){alert('اكتب عنوان الدرس');return}
if(!blank){let sm=null;try{sm=await window.claude?.use('sample')}catch(e){}if(!sm&&!(user&&sb)){alert('التوليد غير متاح هنا، يمكنك إنشاء مذكرة فارغة');return}
const b=$('#mg');b.textContent='جارٍ التوليد...';b.disabled=true;
try{const r=await aiJson(sm,`أنت أستاذ ${m.subject} جزائري خبير بمناهج الجيل الثاني، تكتب مذكرة تربوية جاهزة للاستعمال الصفي. المستوى: ${m.level}. الميدان: ${m.field}. المقطع التعلمي: ${m.seg||'غير محدد'}. المحتوى المعرفي: ${m.topic}. زمن الإنجاز: ${m.dur}.
أعد JSON فقط بلا أي نص خارجه: {"comp":[],"means":[],"rows":[{"stage":"","text":"","eval":"","time":""}]}.
القواعد:
1) comp: ثلاثة إلى أربعة أهداف تعلمية سلوكية قابلة للقياس، كل هدف يبدأ بفعل مضارع (يتعرف، يميز، يعرب، يوظف...).
2) means: الكتاب المدرسي، مخطط التعلم السنوي، الدليل المنهجي، السبورة. لا تخترع أرقام صفحات.
3) rows أربعة عناصر بهذا الترتيب وبهذه الأسماء: "الانطلاق" ثم "بناء التعلمات" ثم "استثمار المكتسبات" ثم "الختام".
- الانطلاق: تبدأ بـ "أهيّئ:" وضعية انطلاقية قصيرة واقعية تنتهي بسؤال يقود المتعلمين إلى موضوع الدرس. التقويم: "تشخيصي: يدرك أن ...".
- بناء التعلمات: "الوضعية الجزئية الأولى" ثم أمثلة أو نص قصير حقيقي صحيح لغويًا ومناسب للمستوى (مع شواهد من القرآن الكريم أو الشعر عند الاقتضاء)، ثم خطوات مرقمة (1- قراءة نموذجية من الأستاذ 2- قراءة المتعلمين 3- مناقشة)، ثم أسئلة مرقمة بصيغة "س1: ... ج: ..." بإجابات دقيقة، ثم "الاستنتاج 1:" بصياغة موجزة. كرر ذلك لكل فكرة، ثم "إعراب نموذجي" إن كان الدرس نحويًا. التقويم مرحلي بمؤشرات مرقمة (1- يدوّن المتعلم ... 2- يقرأ ... 3- يناقش ...).
- استثمار المكتسبات: "الوضعية الجزئية الثانية" بتدريبات متنوعة بأسئلة وأجوبة، ثم "تكليف منزلي" بتمرينين متدرجين، ثم "فوائد" قصيرة.
- الختام: "تقويم ختامي" بسؤال تطبيقي أو فقرة قصيرة، تقويمها "ختامي: يطبّق ويرسّخ"، وتنتهي بعبارة "بالتوفيق والسداد".
4) time: دقائق بأرقام فقط، ومجموعها يساوي زمن الإنجاز.
5) تحقق من صحة كل إعراب وقاعدة ومثال قبل كتابته، ولا تضع معلومة غير مؤكدة.
6) استعمل \\n لفصل الأسطر داخل النصوص، وعربية فصحى سليمة.`);
m.comp=r.comp||[];m.means=r.means||m.means;if(r.rows?.length)m.rows=r.rows.map(x=>({stage:x.stage||'',text:x.text||'',eval:x.eval||'',time:x.time||''}))}catch(e){alert(e.message=='limit'?'استنفدت حصتك الشهرية من المذكرات':'تعذر التوليد: '+e.message);b.textContent='✨ توليد المذكرة بالذكاء الاصطناعي';b.disabled=false;return}}
db.mem.push(m);sel.mid=m.id;save();go()}
function pho(f){if(!f)return;const R=new FileReader();R.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),z=Math.min(1,256/Math.max(i.width,i.height));c.width=i.width*z;c.height=i.height*z;c.getContext('2d').drawImage(i,0,0,c.width,c.height);db.photo=c.toDataURL('image/jpeg',.85);save();go()};i.src=R.result};R.readAsDataURL(f)}
P.prof=()=>{const f=[['teacher','اسم الأستاذ'],['school','المؤسسة'],['subject','المادة التي تدرسها'],['year','السنة الدراسية']];
return`<h2>ملف الأستاذ</h2><div class="card"><div class="bar">${db.photo?`<img src="${db.photo}" style="width:84px;height:84px;border-radius:50%;object-fit:cover">`:`<div style="width:84px;height:84px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.2em">${E((db.teacher||'؟').replace('الأستاذ ','').charAt(0))}</div>`}<div><b>${E(db.teacher)}</b><br><span class="m">${E(db.subject)} • ${E(db.phase)}<br>${E(db.school)}</span><br><label class="btn s o" style="display:inline-block;margin:6px 0 0;cursor:pointer">${db.photo?'تغيير الصورة':'إضافة صورة'}<input type="file" accept="image/*" hidden onchange="pho(this.files[0])"></label>${db.photo?' <button class="btn s d" onclick="db.photo=\'\';save();go()">حذف الصورة</button>':''}</div></div></div><div class="card">${f.map(([k,l])=>`<label>${l}</label><input value="${E(db[k])}" onchange="db['${k}']=this.value;save();go()">`).join('')}<label>الطور</label><select onchange="db.phase=this.value;save();go()">${['الابتدائي','المتوسط','الثانوي'].map(x=>`<option ${x==db.phase?'selected':''}>${x}</option>`).join('')}</select><p class="m">المادة تُستعمل تلقائيًا عند إضافة قسم جديد.</p></div>`};
function xl(name,sheets){if(!window.XLSX){alert('تعذر تحميل مكتبة Excel، تحقق من الاتصال');return}const wb=XLSX.utils.book_new();for(const k in sheets){const ws=XLSX.utils.aoa_to_sheet(sheets[k]);ws['!cols']=sheets[k][0].map(()=>({wch:18}));XLSX.utils.book_append_sheet(wb,ws,k.slice(0,31))}wb.Workbook={Views:[{RTL:true}]};
const b=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function expStu(){xl('التلاميذ.xlsx',{'التلاميذ':[['الاسم','اللقب','القسم','الجنس','تاريخ الميلاد','المعدل','الحضور %'],...db.students.map(x=>{const t=sstat(x.id);return[x.fn,x.ln,cl(x.cid).name,x.g,x.bd,+f1(t.all),t.rate]})]})}
function expRep(){xl('كشف-النقاط.xlsx',{'كشف النقاط':[['الاسم','اللقب','القسم','معدل الفروض','معدل الاختبارات','المعدل العام','الحضور %','غيابات','تأخرات'],...db.students.map(x=>{const t=sstat(x.id);return[x.fn,x.ln,cl(x.cid).name,+f1(t.fr),+f1(t.ts),+f1(t.all),t.rate,t.a+t.j,t.l]})]})}
function expEx(){const e=db.exams.find(x=>x.id==sel.eid);if(!e)return;const v=Object.values(e.marks);xl(e.name+'.xlsx',{'العلامات':[['الاسم','اللقب','العلامة /'+e.max],...db.students.filter(x=>x.cid==e.cid).map(x=>[x.fn,x.ln,e.marks[x.id]??'']),[],['المتوسط',v.length?+f1(avg(v)):'']]})}
function impTpl(){xl('نموذج-استيراد-التلاميذ.xlsx',{'التلاميذ':[['الاسم','اللقب','الجنس','تاريخ الميلاد','القسم'],['أحمد','بن علي','ذكر','2011-03-15',db.classes[0]?db.classes[0].name:'4AM1']]})}
function impOpen(){$('#mb').innerHTML=`<h3>استيراد التلاميذ من Excel</h3><p class="m">الصف الأول عناوين: الاسم، اللقب، الجنس، تاريخ الميلاد، القسم (اختياري). إن ذُكر القسم في الملف ولم يوجد أُنشئ تلقائيًا.</p><label>القسم الافتراضي</label><select id="ic">${copt().map(([i,n])=>`<option value="${i}">${E(n)}</option>`).join('')}</select><label>الملف (xlsx أو csv)</label><input type="file" id="if" accept=".xlsx,.xls,.csv"><div class="bar" style="margin-top:12px"><button class="btn" onclick="impRun()">استيراد</button><button class="btn o" onclick="impTpl()">تحميل نموذج</button><button class="btn o" onclick="cm()">إلغاء</button></div><p id="im" class="m"></p>`;$('#mod').style.display='flex'}
async function impRun(){const f=$('#if').files[0],m=$('#im');if(!f){m.textContent='اختر ملفًا أولًا';return}if(!window.XLSX){m.textContent='تعذر تحميل مكتبة Excel';return}
try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),H=(rows[0]||[]).map(x=>String(x).trim()),ix=k=>H.findIndex(h=>k.some(w=>h.includes(w)));
let iF=ix(['الاسم','name']),iL=ix(['اللقب','last']),iG=ix(['الجنس','gender']),iB=ix(['الميلاد','birth']),iC=ix(['القسم','class']);if(iF<0)iF=0;if(iL<0&&H.length>1&&iF!=1)iL=1;
const dc=db.classes.find(c=>c.id==$('#ic').value);let add=0,skip=0;
for(const q of rows.slice(1)){const fn=String(q[iF]??'').trim();if(!fn){skip++;continue}const ln=iL>=0?String(q[iL]??'').trim():'';let c=dc;
if(iC>=0&&String(q[iC]).trim()){const nm=String(q[iC]).trim();c=db.classes.find(x=>x.name==nm);if(!c){c={id:id(),name:nm,level:'',subject:db.subject};db.classes.push(c)}}
if(!c||db.students.some(x=>x.cid==c.id&&x.fn==fn&&x.ln==ln)){skip++;continue}
let g=iG>=0?String(q[iG]).trim():'';g=g?(/^(أ?نث|f)/i.test(g)?'أنثى':'ذكر'):'';const bv=iB>=0?q[iB]:'',bd=typeof bv=='number'?new Date(Math.round((bv-25569)*864e5)).toISOString().slice(0,10):String(bv).trim();
db.students.push({id:id(),fn,ln,cid:c.id,g,bd,note:''});add++}
save();cm();go();alert('تم استيراد '+add+' تلميذ'+(skip?' (تخطّي '+skip+')':''))}catch(e){m.textContent='تعذر قراءة الملف'}}
$('#mod').onclick=e=>{if(e.target.id=='mod')cm()};init();
</script></body></html>
